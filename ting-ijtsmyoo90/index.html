<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<title>Ting's Atlas</title>
<link rel="preload" href="../assets/fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(../assets/fonts/barlow-condensed-600.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(../assets/fonts/barlow-condensed-700.woff2) format('woff2')}
/* Layout: navy header + sticky group switcher; "now / next" shortcut card; trips grouped below, 1 column on phones, 2 on wide screens */
:root{
  --board:#0F1B26;--board2:#18293B;--on-board:#FFFFFF;--on-board2:#B9C4CF;
  --signal:#FFC72C;--on-signal:#0F1B26;
  --bg:#EEF1F4;--card:#FFFFFF;--ink:#0F1B26;--ink2:#3E4C59;--ink3:#56636F;--line:#E3E8ED;--line2:#C6CFD8;
  --done:#6B7885;--live:#1F7A35;--live-bg:#E4F4E8;
  --num:'Barlow Condensed','Arial Narrow',sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --board:#07101A;--board2:#132232;--on-board:#F2F5F8;--on-board2:#A9B6C2;
  --bg:#0B141C;--card:#14212D;--ink:#E6ECF1;--ink2:#B8C4CE;--ink3:#97A5B1;--line:#22323F;--line2:#344654;
  --done:#8493A0;--live:#5CC27A;--live-bg:#173326;color-scheme:dark}}
:root[data-theme="dark"]{
  --board:#07101A;--board2:#132232;--on-board:#F2F5F8;--on-board2:#A9B6C2;
  --bg:#0B141C;--card:#14212D;--ink:#E6ECF1;--ink2:#B8C4CE;--ink3:#97A5B1;--line:#22323F;--line2:#344654;
  --done:#8493A0;--live:#5CC27A;--live-bg:#173326;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--board);z-index:10}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--num)}

header{background:var(--board);color:var(--on-board);padding-block:16px 4px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:28px}
.kick{font-family:var(--num);font-size:15px;font-weight:600;letter-spacing:.1em;color:var(--on-board2)}
h1{margin:2px 0 10px;font-size:26px;font-weight:900;line-height:1.25;text-wrap:balance}
.stats{display:flex;gap:22px;padding-bottom:12px}
.stats div{display:flex;align-items:baseline;gap:5px}
.stats b{font-family:var(--num);font-size:28px;font-weight:700;line-height:1;color:var(--signal)}
.stats small{font-size:13px;color:var(--on-board2)}
.a2hs{display:none}
@media (display-mode:standalone){.a2hs{display:none!important}}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--board);padding-block:4px 12px}
.seg{display:flex;gap:4px;background:var(--board2);border-radius:12px;padding:4px}
.seg button{flex:1;min-height:44px;border:0;border-radius:9px;background:none;color:var(--on-board2);font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--signal);color:var(--on-signal)}
.seg button:focus-visible,a:focus-visible{outline:3px solid var(--signal);outline-offset:2px}

main{padding-block:16px calc(28px + env(safe-area-inset-bottom,0px))}

/* now / next */
.hero{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
a.focus{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;color:inherit;text-decoration:none}
a.focus:hover{border-color:var(--line2)}
.fk{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--ink3)}
.fk.live{color:var(--live)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--live)}
@media (prefers-reduced-motion:no-preference){.dot{animation:pulse 1.8s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.35}}
.frow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:6px}
.frow>div{min-width:0}
.ft{font-size:22px;font-weight:900;line-height:1.3;text-wrap:balance}
.fd{font-size:14px;color:var(--ink2);margin-top:2px}
.fd .num{font-size:16px;font-weight:600}
.cd{text-align:right;line-height:1;white-space:nowrap}
.cd b{font-family:var(--num);font-size:52px;font-weight:700;color:var(--ink)}
.cd small{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px}
.prog{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;margin-top:14px}
.prog i{height:6px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--live)}
.prog-l{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink3);margin-top:6px}
a.next{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:12px;color:inherit;text-decoration:none;font-size:14px}
a.next:hover{border-color:var(--line2)}
a.next .l{color:var(--ink3);font-size:12.5px;font-weight:700;letter-spacing:.06em;flex:none}
a.next b{font-weight:700;min-width:0;flex:1}
a.next .c{flex:none;color:var(--ink2)}
a.next .c .num{font-size:18px;font-weight:700;color:var(--ink)}

/* groups */
.grp{margin-bottom:20px}
.gh{display:flex;align-items:baseline;gap:8px;margin:0 2px 8px;font-size:16px;font-weight:700}
.gh .num{font-size:22px}
.gh small{font-size:13px;font-weight:500;color:var(--ink3)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:8px}
a.trip{display:grid;grid-template-columns:5px minmax(0,1fr) auto;column-gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 12px;color:inherit;text-decoration:none;min-height:84px}
a.trip::before{content:"";align-self:stretch;border-radius:3px;background:var(--signal)}
a.trip.done::before{background:var(--line2)}
a.trip.live::before{background:var(--live)}
a.trip:hover{border-color:var(--line2)}
a.trip:active{background:var(--bg)}
.t1{font-size:17px;font-weight:700;line-height:1.35}
.t2{font-size:13.5px;color:var(--ink2);margin-top:1px}
.t2 .num{font-size:16px;font-weight:600}
.t3{font-size:13px;color:var(--ink3);margin-top:3px}
.t3 .num{font-size:15px;font-weight:600;color:var(--ink2)}
.st{text-align:right;white-space:nowrap;line-height:1}
.st.up b{display:block;font-family:var(--num);font-size:30px;font-weight:700;color:var(--ink)}
.st.up small{font-size:12.5px;color:var(--ink3)}
.st.live span{display:inline-block;padding:5px 10px;border-radius:999px;background:var(--live-bg);color:var(--live);font-size:13px;font-weight:700}
.st.done{font-size:13px;color:var(--done)}
</style>
<link rel="manifest" href="manifest.webmanifest"><meta name="application-name" content="Ting"><meta name="apple-mobile-web-app-title" content="Ting"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="theme-color" content="#0F1B26"><link rel="apple-touch-icon" href="../icons/apple-touch-icon.png"><link rel="icon" type="image/svg+xml" href="../icon.svg"><link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png"><style id="app-top">#sbar{display:none}@media (display-mode:standalone){#sbar{display:block;position:fixed;top:0;left:0;right:0;height:calc(env(safe-area-inset-top,0px) + min(40px,env(safe-area-inset-top,0px)));background:var(--board,#0F1B26);z-index:50}html:root{padding-top:0;height:100%;overflow:hidden;background:var(--board,#0F1B26)}html body{position:fixed;top:0;left:0;right:0;bottom:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:none;padding-top:calc(env(safe-area-inset-top,0px) + min(40px,env(safe-area-inset-top,0px)))}html body>header{padding-top:calc(18px - min(12px,env(safe-area-inset-top,0px)))}html body .bar{top:calc(env(safe-area-inset-top,0px) + min(40px,env(safe-area-inset-top,0px)))}html body .strip{top:calc(env(safe-area-inset-top,0px) + min(40px,env(safe-area-inset-top,0px)))}}</style><script id="app-scroll">(function(){if(!(window.matchMedia&&matchMedia("(display-mode: standalone)").matches))return;var o=window.scrollTo.bind(window);window.scrollTo=function(a,b){try{document.body.scrollTo(a,b)}catch(e){}return o(a,b)}})();</script><script src="../a2hs.js?v=6" defer></script></head>
<body><div id="sbar" aria-hidden="true"></div>
<header><div class="wrap">
  <div class="top"><div class="kick">TRIP ARCHIVE</div>
  <button type="button" class="a2hs a2hs-pill"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg>加到主畫面</button></div>
  <h1>Ting's Atlas</h1>
  <div class="stats" id="stats"></div>
</div></header>
<div class="bar"><div class="wrap">
  <div class="seg" role="group" aria-label="分組方式">
    <button type="button" id="g-year" data-g="year">年份</button>
    <button type="button" id="g-continent" data-g="continent">洲別</button>
    <button type="button" id="g-duration" data-g="duration">天數</button>
  </div>
</div></div>
<main><div class="wrap">
  <section class="hero" id="hero" aria-label="目前與下一趟"></section>
  <div id="out"></div>
</div></main>

<script>
// Add new trips here: path (relative to this folder), title, start/end (YYYY-MM-DD), country, continent, party
const TRIPS=[
  {path:'../202610-xian-kyweid2t/',title:'西安・洛陽',start:'2026-10-15',end:'2026-10-20',country:'中國',continent:'亞洲',party:'4 人'},
  {path:'../202610-hiroshima-m1uwp2xm/',title:'廣島・尾道・宮島',start:'2026-10-02',end:'2026-10-06',country:'日本',continent:'亞洲',party:'3 人'},
  {path:'../202610-hkmo-44z2dgzh/',title:'港澳三日',start:'2026-10-25',end:'2026-10-27',country:'港澳',continent:'亞洲',party:'2 人'},
  {path:'../202611-hangzhou-rzsl7lcu/',title:'杭州・嘉興行',start:'2026-11-03',end:'2026-11-10',country:'中國',continent:'亞洲',party:'2 人'},
  {path:'../202611-fukushima-f1i11xqs/',title:'福島・宮城 楓葉四日',start:'2026-11-10',end:'2026-11-13',country:'日本',continent:'亞洲',party:'團體'},
  {path:'../202611-india-7dwneg55/',title:'北印度金三角＋恆河',start:'2026-11-05',end:'2026-11-14',country:'印度',continent:'亞洲',party:'9 人'},
  {path:'../202611-hongkong-y26nrip6/',title:'香港三日',start:'2026-11-17',end:'2026-11-19',country:'香港',continent:'亞洲',party:'2 人'},
  {path:'../202612-italy-5sm4ahyu/',title:'義大利三城聖誕行',start:'2026-12-20',end:'2026-12-30',country:'義大利',continent:'歐洲',party:'2 人'},
  {path:'../202706-finland-pbfhjhvr/',title:'芬蘭・愛沙尼亞親子行',start:'2027-06-25',end:'2027-07-13',country:'芬蘭・愛沙尼亞',continent:'歐洲',party:'大人 1・小孩 1'},
];
const CONT_ORDER=['亞洲','歐洲','北美洲','南美洲','大洋洲','非洲'];
const BUCKETS=[{k:'短程',min:1,max:4,lab:'1–4 天'},{k:'中程',min:5,max:7,lab:'5–7 天'},{k:'長程',min:8,max:999,lab:'8 天以上'}];
const WD='日一二三四五六';
const d=s=>{const[y,m,dd]=s.split('-').map(Number);return new Date(y,m-1,dd)};
const days=t=>Math.round((d(t.end)-d(t.start))/864e5)+1;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function today(){const n=new Date(Date.now()+8*36e5);return new Date(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate())}
function status(t){const n=today(),s=d(t.start),e=d(t.end);
  if(n>e)return{c:'done'};
  if(n>=s)return{c:'live',day:Math.round((n-s)/864e5)+1};
  return{c:'up',left:Math.round((s-n)/864e5)}}
function fmt(t){const s=d(t.start),e=d(t.end);
  return `<span class="num">${s.getFullYear()}/${s.getMonth()+1}/${s.getDate()}</span>（${WD[s.getDay()]}）– <span class="num">${e.getMonth()+1}/${e.getDate()}</span>（${WD[e.getDay()]}）`}
function right(t,st){
  if(st.c==='live')return `<div class="st live"><span>旅行中・第 ${st.day} 天</span></div>`;
  if(st.c==='up')return `<div class="st up"><b>${st.left}</b><small>天後出發</small></div>`;
  return `<div class="st done">已結束</div>`}
function card(t){const n=days(t),st=status(t);
  return `<a class="trip ${st.c}" href="${esc(t.path)}">
  <div><div class="t1">${esc(t.title)}</div><div class="t2">${fmt(t)}</div>
  <div class="t3">${esc(t.country)}・<span class="num">${n}</span> 天 <span class="num">${n-1}</span> 夜・${esc(t.party)}</div></div>
  ${right(t,st)}</a>`}
function hero(){
  const all=[...TRIPS].sort((a,b)=>d(a.start)-d(b.start));
  const live=all.find(t=>status(t).c==='live'),ups=all.filter(t=>status(t).c==='up');
  const t=live||ups[0];if(!t)return'';
  const st=status(t),n=days(t),nx=live?ups[0]:ups[1];
  let h;
  if(st.c==='live'){
    h=`<a class="focus" href="${esc(t.path)}"><div class="fk live"><span class="dot"></span>旅行中</div>
    <div class="ft">${esc(t.title)}</div><div class="fd">${fmt(t)}・${esc(t.party)}</div>
    <div class="prog" aria-hidden="true">${Array.from({length:n},(_,i)=>`<i class="${i<st.day?'on':''}"></i>`).join('')}</div>
    <div class="prog-l"><span>第 <span class="num">${st.day}</span> 天</span><span>共 <span class="num">${n}</span> 天</span></div></a>`;
  }else{
    h=`<a class="focus" href="${esc(t.path)}"><div class="fk">下一趟出發</div>
    <div class="frow"><div><div class="ft">${esc(t.title)}</div><div class="fd">${fmt(t)}・${esc(t.party)}</div></div>
    <div class="cd"><b>${st.left}</b><small>天後</small></div></div></a>`;
  }
  if(nx){const s2=status(nx);
    h+=`<a class="next" href="${esc(nx.path)}"><span class="l">下一趟</span><b>${esc(nx.title)}</b><span class="c"><span class="num">${s2.left}</span> 天後</span></a>`}
  return h}
function group(by){
  const sorted=[...TRIPS].sort((a,b)=>d(a.start)-d(b.start));const m=new Map();
  if(by==='year'){sorted.forEach(t=>{const k=t.start.slice(0,4);(m.get(k)||m.set(k,[]).get(k)).push(t)});
    return[...m].sort((a,b)=>b[0]-a[0]).map(([k,v])=>({h:`<span class="num">${k}</span>`,v}))}
  if(by==='continent'){sorted.forEach(t=>{(m.get(t.continent)||m.set(t.continent,[]).get(t.continent)).push(t)});
    return[...m].sort((a,b)=>CONT_ORDER.indexOf(a[0])-CONT_ORDER.indexOf(b[0])).map(([k,v])=>({h:esc(k),sub:[...new Set(v.map(t=>t.country))].join('・'),v}))}
  return BUCKETS.map(b=>({h:b.k,sub:b.lab,v:sorted.filter(t=>{const n=days(t);return n>=b.min&&n<=b.max})})).filter(g=>g.v.length)}
function render(by){
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.g===by));
  document.getElementById('out').innerHTML=group(by).map(g=>`<section class="grp"><div class="gh">${g.h}<small>${g.sub?esc(g.sub)+'・':''}${g.v.length} 趟</small></div><div class="list">${g.v.map(card).join('')}</div></section>`).join('');
  try{localStorage.setItem('trips-group',by)}catch(e){}}
const totalDays=TRIPS.reduce((s,t)=>s+days(t),0),countries=new Set(TRIPS.flatMap(t=>t.country.split('・'))).size;
document.getElementById('stats').innerHTML=[[TRIPS.length,'趟行程'],[totalDays,'天'],[countries,'個國家']].map(([n,l])=>`<div><b>${n}</b><small>${l}</small></div>`).join('');
document.getElementById('hero').innerHTML=hero();
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>render(b.dataset.g)));
let init='year';try{const s=localStorage.getItem('trips-group');if(['year','continent','duration'].includes(s))init=s}catch(e){}
render(init);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
