<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<title>那些年Ting排的AI行程</title>
<link rel="preload" href="../assets/fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(../assets/fonts/barlow-condensed-600.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(../assets/fonts/barlow-condensed-700.woff2) format('woff2')}
:root{
  --board:#0F1B26;--board2:#18293B;--board-line:#2C3F52;--on-board:#fff;--on-board2:#B9C4CF;
  --signal:#FFC72C;--on-signal:#0F1B26;
  --bg:#EEF1F4;--card:#fff;--ink:#0F1B26;--ink2:#3E4C59;--ink3:#56636F;--line:#E3E8ED;--line2:#C6CFD8;
  --done:#8A96A3;--live:#2B8A3E;
  --num:'Barlow Condensed','Arial Narrow',sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --board:#07101A;--board2:#132232;--board-line:#26384A;--on-board:#F2F5F8;--on-board2:#A9B6C2;
  --bg:#0B141C;--card:#14212D;--ink:#E6ECF1;--ink2:#B8C4CE;--ink3:#97A5B1;--line:#22323F;--line2:#344654;
  --done:#6E7D8A;--live:#5CC27A;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-text-size-adjust:100%}
header{background:var(--board);color:var(--on-board);padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 14px}
.wrap{max-width:640px;margin:0 auto}
.kick{font-family:var(--num);font-size:15px;font-weight:600;letter-spacing:.08em;color:var(--on-board2)}
h1{margin:2px 0 12px;font-size:23px;font-weight:900;line-height:1.3}
.stats{display:flex;gap:18px;margin-bottom:12px}
.stats div{display:flex;flex-direction:column;line-height:1.1}
.stats b{font-family:var(--num);font-size:26px;font-weight:700;color:var(--signal)}
.stats small{font-size:12px;color:var(--on-board2)}
.seg{display:flex;gap:4px;background:var(--board2);border-radius:12px;padding:4px}
.seg button{flex:1;min-height:38px;border:0;border-radius:9px;background:none;color:var(--on-board2);font:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--signal);color:var(--on-signal)}
.seg button:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
main{padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.grp{margin-bottom:16px}
.gh{display:flex;align-items:baseline;gap:8px;margin:0 2px 8px;font-size:15px;font-weight:700}
.gh .num{font-family:var(--num);font-size:20px}
.gh small{font-size:12.5px;font-weight:500;color:var(--ink3)}
.list{display:flex;flex-direction:column;gap:8px}
a.trip{display:grid;grid-template-columns:6px minmax(0,1fr) auto;column-gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 12px;color:inherit;text-decoration:none}
a.trip::before{content:"";align-self:stretch;border-radius:3px;background:var(--signal)}
a.trip.done::before{background:var(--line2)}
a.trip:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.t1{font-size:17px;font-weight:700;line-height:1.35}
.t2{font-size:13.5px;color:var(--ink2)}
.t2 .num{font-family:var(--num);font-size:15.5px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:12px;line-height:1;padding:4px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--ink3)}
.st{font-size:12.5px;font-weight:700;white-space:nowrap;text-align:right}
.st.up{color:var(--ink)} .st.up b{font-family:var(--num);font-size:22px;color:var(--ink)}
.st.live{color:var(--live)} .st.done{color:var(--done);font-weight:500}
.a2hs{display:none}@media (display-mode:standalone){.a2hs{display:none!important}}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
</style>
<link rel="manifest" href="manifest.webmanifest"><meta name="application-name" content="Ting"><meta name="apple-mobile-web-app-title" content="Ting"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="theme-color" content="#0F1B26"><link rel="apple-touch-icon" href="../icons/apple-touch-icon.png"><link rel="icon" type="image/svg+xml" href="../icon.svg"><link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png"><style id="app-top">#sbar{display:none}@media (display-mode:standalone){#sbar{display:block;position:fixed;top:0;left:0;right:0;height:calc(env(safe-area-inset-top,0px) + min(40px,env(safe-area-inset-top,0px)));background:var(--board,#0F1B26);z-index:50}html:root{padding-top:0;height:100%;overflow:hidden;background:var(--board,#0F1B26)}html body{position:fixed;top:0;left:0;right:0;bottom:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:none;padding-top:calc(env(safe-area-inset-top,0px) + min(40px,env(safe-area-inset-top,0px)))}html body>header{padding-top:calc(18px - min(12px,env(safe-area-inset-top,0px)))}html body .strip{top:calc(env(safe-area-inset-top,0px) + min(40px,env(safe-area-inset-top,0px)))}}</style><script id="app-scroll">(function(){if(!(window.matchMedia&&matchMedia("(display-mode: standalone)").matches))return;var o=window.scrollTo.bind(window);window.scrollTo=function(a,b){try{document.body.scrollTo(a,b)}catch(e){}return o(a,b)}})();</script><script src="../a2hs.js?v=6" defer></script></head>
<body><div id="sbar" aria-hidden="true"></div>
<header><div class="wrap">
  <div class="top"><div class="kick">TRIP ARCHIVE</div>
  <button type="button" class="a2hs a2hs-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg>加到主畫面</button></div>
  <h1>那些年Ting排的AI行程</h1>
  <div class="stats" id="stats"></div>
  <div class="seg" role="group" aria-label="分組方式">
    <button type="button" data-g="year">年份</button>
    <button type="button" data-g="continent">洲別</button>
    <button type="button" data-g="duration">天數</button>
  </div>
</div></header>
<main><div class="wrap" id="out"></div></main>
<script>
// Add new trips here: path (relative to this folder), title, start/end (YYYY-MM-DD), country, continent, party
const TRIPS=[
  {path:'../202610-xian-kyweid2t/',title:'西安・洛陽',start:'2026-10-15',end:'2026-10-20',country:'中國',continent:'亞洲',party:'4 人'},
  {path:'../202610-hiroshima-m1uwp2xm/',title:'廣島・尾道・宮島',start:'2026-10-02',end:'2026-10-06',country:'日本',continent:'亞洲',party:'3 人'},
  {path:'../202611-hangzhou-rzsl7lcu/',title:'杭州・嘉興行',start:'2026-11-03',end:'2026-11-10',country:'中國',continent:'亞洲',party:'2 人'},
  {path:'../202611-india-7dwneg55/',title:'北印度金三角＋恆河',start:'2026-11-05',end:'2026-11-14',country:'印度',continent:'亞洲',party:'9 人'},
  {path:'../202612-italy-5sm4ahyu/',title:'義大利三城聖誕行',start:'2026-12-20',end:'2026-12-30',country:'義大利',continent:'歐洲',party:'2 人'},
  {path:'../202706-finland-pbfhjhvr/',title:'芬蘭・愛沙尼亞親子行',start:'2027-06-25',end:'2027-07-13',country:'芬蘭・愛沙尼亞',continent:'歐洲',party:'大人 1・小孩 1'},
];
const CONT_ORDER=['亞洲','歐洲','北美洲','南美洲','大洋洲','非洲'];
const BUCKETS=[{k:'短程',min:1,max:4,lab:'1–4 天'},{k:'中程',min:5,max:7,lab:'5–7 天'},{k:'長程',min:8,max:999,lab:'8 天以上'}];
const WD='日一二三四五六';
const d=s=>{const[y,m,dd]=s.split('-').map(Number);return new Date(y,m-1,dd)};
const days=t=>Math.round((d(t.end)-d(t.start))/864e5)+1;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function today(){const n=new Date(Date.now()+8*36e5);return new Date(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate())}
function status(t){const n=today(),s=d(t.start),e=d(t.end);
  if(n>e)return{c:'done',h:'已結束'};
  if(n>=s)return{c:'live',h:'旅行中'};
  return{c:'up',h:'倒數 <b>'+Math.round((s-n)/864e5)+'</b> 天'}}
function fmt(t){const s=d(t.start),e=d(t.end);
  return `<span class="num">${s.getFullYear()}/${s.getMonth()+1}/${s.getDate()}</span>（${WD[s.getDay()]}）– <span class="num">${e.getMonth()+1}/${e.getDate()}</span>（${WD[e.getDay()]}）`}
function card(t){const n=days(t),st=status(t);
  return `<a class="trip ${st.c==='done'?'done':''}" href="${esc(t.path)}">
  <div><div class="t1">${esc(t.title)}</div><div class="t2">${fmt(t)}</div>
  <div class="chips"><span class="chip">${esc(t.country)}</span><span class="chip">${n}天${n-1}夜</span><span class="chip">${esc(t.party)}</span></div></div>
  <div class="st ${st.c}">${st.h}</div></a>`}
function group(by){
  const sorted=[...TRIPS].sort((a,b)=>d(b.start)-d(a.start));const m=new Map();
  if(by==='year'){sorted.forEach(t=>{const k=t.start.slice(0,4);(m.get(k)||m.set(k,[]).get(k)).push(t)});
    return[...m].sort((a,b)=>b[0]-a[0]).map(([k,v])=>({h:`<span class="num">${k}</span>`,v}))}
  if(by==='continent'){sorted.forEach(t=>{(m.get(t.continent)||m.set(t.continent,[]).get(t.continent)).push(t)});
    return[...m].sort((a,b)=>CONT_ORDER.indexOf(a[0])-CONT_ORDER.indexOf(b[0])).map(([k,v])=>({h:esc(k),sub:[...new Set(v.map(t=>t.country))].join('・'),v}))}
  return BUCKETS.map(b=>({h:b.k,sub:b.lab,v:sorted.filter(t=>{const n=days(t);return n>=b.min&&n<=b.max})})).filter(g=>g.v.length)}
function render(by){
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.g===by));
  document.getElementById('out').innerHTML=group(by).map(g=>`<section class="grp"><div class="gh">${g.h}<small>${g.sub?esc(g.sub)+'・':''}${g.v.length} 趟</small></div><div class="list">${g.v.map(card).join('')}</div></section>`).join('');
  try{localStorage.setItem('trips-group',by)}catch(e){}}
const totalDays=TRIPS.reduce((s,t)=>s+days(t),0),countries=new Set(TRIPS.flatMap(t=>t.country.split('・'))).size;
document.getElementById('stats').innerHTML=[[TRIPS.length,'趟行程'],[totalDays,'天'],[countries,'個國家']].map(([n,l])=>`<div><b>${n}</b><small>${l}</small></div>`).join('');
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>render(b.dataset.g)));
let init='year';try{const s=localStorage.getItem('trips-group');if(['year','continent','duration'].includes(s))init=s}catch(e){}
render(init);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
