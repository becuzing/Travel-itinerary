<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ting 的旅行</title>
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="description" content="所有旅行行程：進行中、即將出發、已結束">
<meta name="theme-color" content="#0F1B26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="旅行">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="assets/fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(assets/fonts/barlow-condensed-600.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(assets/fonts/barlow-condensed-700.woff2) format('woff2')}
:root{
  --board:#0F1B26;--board2:#18293B;--board-line:#2C3F52;--on-board:#FFFFFF;--on-board2:#B9C4CF;
  --signal:#FFC72C;--on-signal:#0F1B26;
  --bg:#EEF1F4;--card:#FFFFFF;--ink:#0F1B26;--ink2:#3E4C59;--ink3:#56636F;--line:#E3E8ED;--line2:#C6CFD8;
  --link:#0B5CB0;
  --num:'Barlow Condensed','Arial Narrow',sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --board:#07101A;--board2:#132232;--board-line:#26384A;--on-board:#F2F5F8;--on-board2:#A9B6C2;
  --bg:#0B141C;--card:#14212D;--ink:#E6ECF1;--ink2:#B8C4CE;--ink3:#97A5B1;--line:#22323F;--line2:#344654;--link:#7DB7F5;color-scheme:dark}}
:root[data-theme="dark"]{
  --board:#07101A;--board2:#132232;--board-line:#26384A;--on-board:#F2F5F8;--on-board2:#A9B6C2;
  --bg:#0B141C;--card:#14212D;--ink:#E6ECF1;--ink2:#B8C4CE;--ink3:#97A5B1;--line:#22323F;--line2:#344654;--link:#7DB7F5;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding:0 16px calc(28px + env(safe-area-inset-bottom,0px))}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

.hd{background:var(--board);color:var(--on-board);margin-inline:-16px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 18px}
@media (min-width:672px){.hd{border-radius:0 0 18px 18px}}
.kick{font-family:var(--num);font-size:16px;font-weight:600;letter-spacing:.08em;color:var(--on-board2)}
.hd h1{margin:2px 0 0;font-size:26px;line-height:1.25;font-weight:900}
.today{margin:4px 0 0;font-size:14px;color:var(--on-board2)}
.today b{font-family:var(--num);font-size:18px;color:var(--signal);font-weight:700;margin:0 2px}

/* live trip = the departure board */
.live{display:block;margin-top:14px;background:var(--board2);border-radius:14px;padding:12px;color:var(--on-board)}
.live .row{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.tag{font-family:var(--num);font-weight:700;letter-spacing:.12em;background:var(--signal);color:var(--on-signal);border-radius:4px;padding:0 7px;font-size:15px;line-height:1.5}
.live .dayn{font-family:var(--num);font-size:30px;font-weight:700;line-height:1}
.live .of{font-size:20px;color:var(--on-board2);font-weight:600}
.live .t{margin-top:6px;font-size:19px;font-weight:800;line-height:1.35}
.live .s{font-size:14px;color:var(--on-board2);line-height:1.45}
.live .now{margin-top:6px;padding-top:8px;border-top:1px solid var(--board-line);font-size:14.5px;line-height:1.45}
.live .now span{font-family:var(--num);font-weight:700;letter-spacing:.12em;color:var(--signal);margin-right:8px}
.bar{height:5px;margin-top:10px;border-radius:999px;background:var(--board-line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--signal);border-radius:999px}
.go{margin-top:12px;min-height:46px;border-radius:10px;background:var(--signal);color:var(--on-signal);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px}
.go svg{width:18px;height:18px}

.body{display:flex;flex-direction:column;gap:8px;padding-top:14px}
.sec{display:flex;align-items:baseline;justify-content:space-between;padding:6px 2px 0}
.sec h2{margin:0;font-size:17px;font-weight:800}
.sec small{font-size:13px;color:var(--ink3)}
.list{list-style:none;margin:0;padding:0;background:var(--card);border-radius:14px;overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.trip{display:grid;grid-template-columns:64px minmax(0,1fr) 18px;gap:12px;align-items:center;min-height:76px;padding:12px}
.trip .cd{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;border-radius:10px;background:var(--bg);padding:8px 0}
.trip .cd b{font-family:var(--num);font-size:26px;font-weight:700}
.trip .cd small{font-size:12px;color:var(--ink3);font-weight:600}
.trip .cd.soon{background:var(--signal);color:var(--on-signal)}
.trip .cd.soon small{color:var(--on-signal)}
.trip .tt{display:block;font-size:16.5px;font-weight:800;line-height:1.35}
.trip .dt{display:block;font-family:var(--num);font-size:16px;font-weight:600;color:var(--ink2);letter-spacing:.02em}
.trip .pp{display:block;font-size:13.5px;color:var(--ink2);line-height:1.45}
.trip>svg{width:18px;height:18px;color:var(--ink3)}
.past .trip{opacity:.62;min-height:64px}
.past .trip .cd b{font-size:20px}
details.past-wrap summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 2px;font-size:15px;font-weight:700;color:var(--ink2)}
details.past-wrap summary::-webkit-details-marker{display:none}
details.past-wrap summary small{font-weight:500;color:var(--ink3);font-size:13px;margin-left:6px}
details.past-wrap[open] summary svg{transform:rotate(180deg)}
.hint{margin:6px 2px 0;font-size:13px;line-height:1.55;color:var(--ink3)}
</style>
</head>
<body>
<div class="app">
  <header class="hd">
    <div class="kick">TRIPS</div>
    <h1>旅行行程</h1>
    <p class="today" id="today"></p>
    <div id="live"></div>
  </header>
  <main class="body" id="list"></main>
  <p class="hint">每個行程打開過一次，之後沒有網路也能看。在中國大陸若用當地網路打不開，請改用台灣門號漫遊，或先在出發前打開一次。</p>
</div>
<script>
const TRIPS=[
 {id:'xian',title:'西安・洛陽',start:'2026-10-15',end:'2026-10-20',tz:8,len:'6天5夜',who:'4 人',where:'兵馬俑・陝博・城牆・龍門石窟',
  days:["抵達西安・同盛祥泡饃","兵馬俑・華清宮・鐘鼓樓","陝博・大雁塔・大唐不夜城","城牆・西安博物院","洛陽龍門石窟・水席（或留在西安）","返台"]},
 {id:'hangzhou',title:'杭州・嘉興行',start:'2026-11-03',end:'2026-11-10',tz:8,len:'8天7夜',who:'2 人',where:'杭州・東陽・嘉興',
  days:["BR758 飛杭州","東陽祭祖","親戚聚餐","拱宸橋、片兒川、錢江新城夜景","Check-out、知味觀、去嘉興南湖賓館","朋友女兒婚禮","婚禮活動","BR757 回台北"]},
 {id:'italy',title:'義大利三城聖誕行',start:'2026-12-20',end:'2026-12-30',tz:1,len:'11天10夜',who:'2 人',where:'佛羅倫斯・威尼斯・羅馬',
  days:["桃園 → 羅馬夜班機","抵羅馬 → 高鐵到佛羅倫斯","Uffizi、Oltrarno、日落","David、牛排、登圓頂","前往威尼斯，平安夜","威尼斯聖誕節","Murano、Burano","前往羅馬","梵蒂岡","古羅馬、Trastevere","返台"]},
 {id:'finland',title:'芬蘭・愛沙尼亞親子行',start:'2027-06-25',end:'2027-07-13',tz:3,len:'19天18夜',who:'大人 1・小孩 1',where:'Helsinki・Tampere・Tallinn・Tartu・Pärnu',days:[]},
 {id:'hiroshima',title:'廣島・尾道・宮島',start:'2026-10-02',end:'2026-10-06',tz:9,len:'5天4夜',who:'3 人',where:'廣島・尾道・宮島',days:[]}
];
const chev='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
const down='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
const WD=['日','一','二','三','四','五','六'];
const ymdIn=tz=>{const n=new Date(Date.now()+tz*3600000);return n.toISOString().slice(0,10);};
const diff=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/86400000);
const md=s=>+s.slice(5,7)+'/'+ +s.slice(8,10);
const wd=s=>WD[new Date(s+'T00:00:00Z').getUTCDay()];
const range=t=>`${t.start.slice(0,4)} ${md(t.start)}（${wd(t.start)}）– ${md(t.end)}（${wd(t.end)}）`;
function card(t,state,n){
  const cd=state==='past'?`<span class="cd"><b>${md(t.start)}</b><small>${t.start.slice(0,4)}</small></span>`
    :`<span class="cd${n<=7?' soon':''}"><b>${n}</b><small>天後</small></span>`;
  return `<li><a class="trip" href="${t.id}.html">${cd}<span><span class="tt">${t.title}</span><span class="dt">${range(t)}</span><span class="pp">${t.len}・${t.who}・${t.where}</span></span>${chev}</a></li>`;}
const now=ymdIn(8);
document.getElementById('today').innerHTML=`今天 <b>${md(now)}</b>（${wd(now)}）`;
const live=[],up=[],past=[];
TRIPS.forEach(t=>{const td=ymdIn(t.tz);if(td>t.end)past.push(t);else if(td>=t.start)live.push(t);else up.push(t);});
up.sort((a,b)=>a.start<b.start?-1:1);past.sort((a,b)=>a.start>b.start?-1:1);
document.getElementById('live').innerHTML=live.map(t=>{const td=ymdIn(t.tz),k=diff(t.start,td),tot=diff(t.start,t.end)+1;
  const today=t.days[k]||'',next=t.days[k+1]||'';
  return `<a class="live" href="${t.id}.html"><div class="row"><span class="tag">進行中</span><span class="dayn">DAY ${k+1}<span class="of"> / ${tot}</span></span></div>
  <div class="t">${t.title}</div><div class="s">${range(t)}　${t.len}・${t.who}</div><div class="s">${t.where}</div>
  ${today?`<div class="now"><span>TODAY</span>${today}</div>`:''}${next?`<div class="now" style="border-top:0;padding-top:0;margin-top:2px;color:var(--on-board2)"><span style="color:var(--on-board2)">NEXT</span>${next}</div>`:''}
  <div class="bar"><i style="width:${Math.round((k+1)/tot*100)}%"></i></div>
  <div class="go">打開今天行程${chev}</div></a>`;}).join('');
let h='';
if(up.length)h+=`<div class="sec"><h2>即將出發</h2><small>${up.length} 個行程</small></div><ul class="list">${up.map(t=>card(t,'up',diff(now,t.start))).join('')}</ul>`;
if(past.length)h+=`<details class="past-wrap"><summary><span>已結束<small>${past.length} 個行程</small></span>${down}</summary><ul class="list past">${past.map(t=>card(t,'past')).join('')}</ul></details>`;
document.getElementById('list').innerHTML=h;
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
