html{-webkit-tap-highlight-color:transparent}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:500;font-display:swap;src:url(assets/fonts/barlow-condensed-500.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(assets/fonts/barlow-condensed-600.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(assets/fonts/barlow-condensed-700.woff2) format('woff2')}

/* Layout: transit-board — navy departure board header (date strip, NOW/NEXT), metro-line timeline, bottom nav */
:root{
  --board:#0F1B26; --board2:#18293B; --board-line:#2C3F52; --board-btn:#4A5D70; --on-board:#FFFFFF; --on-board2:#B9C4CF;
  --signal:#FFC72C; --on-signal:#0F1B26;
  --bg:#EEF1F4; --card:#FFFFFF; --ink:#0F1B26; --ink2:#3E4C59; --ink3:#56636F; --line:#E3E8ED; --line2:#C6CFD8;
  --anchor:#0B6BCB; --anchor-ink:#0B5CB0; --anchor-bg:#E6F0FC; --meal:#D9480F; --meal-ink:#A63A0A; --hotel:#2B8A3E; --hotel-ink:#22703A;
  --flight:#0F1B26; --flight-bg:#0F1B26; --on-flight:#FFFFFF; --on-flight2:#B9C4CF; --plain:#8A96A3; --move:#8A96A3;
  --link:#0B5CB0; --link-bg:#E7EEF6; --on-link:#FFFFFF;
  --warn-bg:#FFF0E6; --warn-fg:#8A3208; --sos:#C92A2A; --on-sos:#FFFFFF;
  --plane-m:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cpath%20d%3D%22M17.8%2019.2%2016%2011l3.5-3.5C21%206%2021.5%204%2021%203c-1-.5-3%200-4.5%201.5L13%208%204.8%206.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1%201%20.3%201.3L9%2012l-2%203H4l-1%201%203%202%202%203%201-1v-3l3-2%203.5%205.3c.3.4.8.5%201.3.3l.5-.2c.4-.3.6-.7.5-1.2z%22%20fill%3D%22black%22/%3E%3C/svg%3E");
  --train-m:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%222.6%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Crect%20x%3D%225%22%20y%3D%223%22%20width%3D%2214%22%20height%3D%2214%22%20rx%3D%223%22/%3E%3Cpath%20d%3D%22M5%2011h14M9%2021l-2-4M15%2021l2-4%22/%3E%3C/svg%3E");
  --num:'Barlow Condensed','Arial Narrow',sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Noto Sans CJK TC','Microsoft JhengHei',sans-serif;
  --sc:'PingFang SC','Noto Sans SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --board:#07101A; --board2:#132232; --board-line:#26384A; --board-btn:#3B4E61; --on-board:#F2F5F8; --on-board2:#A9B6C2;
    --bg:#0B141C; --card:#14212D; --ink:#E6ECF1; --ink2:#B8C4CE; --ink3:#97A5B1; --line:#22323F; --line2:#344654;
    --anchor:#5AA6F0; --anchor-ink:#7DB7F5; --anchor-bg:#16304A; --meal:#FF8A50; --meal-ink:#FFA477; --hotel:#5CC27A; --hotel-ink:#7DD394;
    --flight:#C9D3DC; --flight-bg:#DCE6F0; --on-flight:#0F1B26; --on-flight2:#3E4C59; --plain:#6E7D8A; --move:#6E7D8A;
    --link:#7DB7F5; --link-bg:#1A2F44; --on-link:#07101A;
    --warn-bg:#3A2114; --warn-fg:#FFC09A; --sos:#D9413A; --on-sos:#FFFFFF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --board:#07101A; --board2:#132232; --board-line:#26384A; --board-btn:#3B4E61; --on-board:#F2F5F8; --on-board2:#A9B6C2;
  --bg:#0B141C; --card:#14212D; --ink:#E6ECF1; --ink2:#B8C4CE; --ink3:#97A5B1; --line:#22323F; --line2:#344654;
  --anchor:#5AA6F0; --anchor-ink:#7DB7F5; --anchor-bg:#16304A; --meal:#FF8A50; --meal-ink:#FFA477; --hotel:#5CC27A; --hotel-ink:#7DD394;
  --flight:#C9D3DC; --flight-bg:#DCE6F0; --on-flight:#0F1B26; --on-flight2:#3E4C59; --plain:#6E7D8A; --move:#6E7D8A;
  --link:#7DB7F5; --link-bg:#1A2F44; --on-link:#07101A;
  --warn-bg:#3A2114; --warn-fg:#FFC09A; --sos:#D9413A; --on-sos:#FFFFFF; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
a{color:var(--link)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(70px + env(safe-area-inset-bottom,0px))}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

/* date strip */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--board);margin-inline:-16px;padding:8px 16px}
.strip::-webkit-scrollbar{display:none}
.dd{flex:1 0 46px;min-height:42px;border:0;border-radius:10px;background:none;color:var(--on-board2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:4px 2px}
.dd b{font-family:var(--num);font-size:19px;font-weight:600;color:var(--on-board)}
.dd small{font-size:11.5px;margin-top:2px}
.dd.td small{color:var(--signal);font-weight:700}
.dd[aria-selected="true"]{background:var(--signal);color:var(--on-signal)}
.dd[aria-selected="true"] b,.dd[aria-selected="true"] small{color:var(--on-signal)}

/* header board */
.hd{background:var(--board);color:var(--on-board);margin-inline:-16px;padding:8px 16px 14px;display:flex;flex-direction:column;gap:6px}
@media (min-width:672px){.hd{border-radius:0 0 18px 18px}}
.kick{display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:var(--num);font-size:16px;font-weight:600;letter-spacing:.06em;color:var(--on-board2)}
.kick span{min-width:0}
.sosb{flex:0 0 auto;min-height:32px;padding:0 10px;border-radius:8px;border:1.5px solid #FF8A80;background:none;color:#FFB3AC;font-family:var(--sans);font-size:13.5px;font-weight:700;letter-spacing:0;cursor:pointer}
.hd h1{margin:0;font-size:22px;line-height:1.3;font-weight:900;text-wrap:balance}
.hd .meta{margin:0;font-size:13px;line-height:1.45;color:var(--on-board2)}
.cd{margin:0;font-size:15px;color:var(--on-board2)}
.cd b{font-family:var(--num);font-size:24px;color:var(--signal);margin:0 2px}

/* NOW / NEXT board */
.nowb{background:var(--board2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:5px;margin-top:2px}
.nrow{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.tag,.nowtag{font-family:var(--num);font-weight:700;letter-spacing:.12em;background:var(--signal);color:var(--on-signal);border-radius:4px;padding:0 7px;font-size:15px;line-height:1.5}
.big{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:30px;font-weight:700;line-height:1}
.left{font-size:13px;color:var(--on-board2)}
.nt1{font-size:18px;font-weight:700;line-height:1.35}
.nsub{font-size:13px;line-height:1.45;color:var(--on-board2)}
.nrem{font-size:13px;line-height:1.45;color:var(--on-board)}
.bar{height:5px;margin-block:3px;border-radius:999px;background:var(--board-line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--signal);border-radius:999px}
.next{border-top:1px solid var(--board-line);padding-top:7px;margin-top:3px;display:flex;align-items:baseline;gap:2px 8px;flex-wrap:wrap;font-size:13.5px;color:var(--on-board2)}
.next .tag2{font-family:var(--num);font-weight:700;letter-spacing:.12em;color:var(--signal);font-size:14px}
.next .nt2{font-family:var(--num);font-size:18px;font-weight:600;color:var(--on-board)}

/* buttons */
.acts{display:flex;flex-wrap:wrap;gap:6px}
/* actions are quiet secondary controls: outline, muted label, coloured icon as the find-cue. Map is not filled. */
.act{min-height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--line2);background:transparent;color:var(--ink2);font-size:13.5px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;white-space:nowrap}
.act svg{flex:0 0 auto;width:15px;height:15px;color:var(--link)}
.act:hover{border-color:var(--link);color:var(--link)}
.act.sm{min-height:30px;font-size:13px;padding:0 10px}
.bd .acts{gap:5px}
.bd .act{padding:0 7px;gap:3px;font-size:13px}
.nowb .acts{margin-top:4px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.nowb .acts::-webkit-scrollbar{display:none}
.nowb .act{border-color:var(--board-btn);color:var(--on-board2);flex:0 0 auto;padding:0 7px;gap:4px;font-size:13px}
.nowb .act svg{color:var(--on-board2)}
.nowb .act:hover{border-color:var(--on-board2);color:var(--on-board)}

/* body */
.body{display:flex;flex-direction:column;gap:8px;padding-top:10px}
.warn{margin:0;background:var(--warn-bg);color:var(--warn-fg);border-radius:10px;padding:7px 11px;font-size:13.5px;line-height:1.45}
.warn b{margin-right:8px}
.vt{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.vt button{flex:1;min-height:40px;border:0;border-radius:9px;background:none;color:var(--ink2);font-size:14.5px;font-weight:600;cursor:pointer}
.vt button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.sum{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink2)}
.pastb{min-height:36px;border:0;border-radius:10px;background:var(--card);color:var(--ink2);font-size:13.5px;display:flex;align-items:center;gap:8px;padding:0 12px;cursor:pointer;text-align:left}
.pastb span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pastb[aria-expanded="true"] svg{transform:rotate(180deg)}
.wide{min-height:38px;border-radius:10px;border:1.5px solid var(--line2);background:var(--card);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer}

/* metro timeline */
.tl{list-style:none;margin:0;padding:4px 12px;background:var(--card);border-radius:14px}
.st{display:grid;grid-template-columns:54px 22px minmax(0,1fr);column-gap:8px;--kc:var(--plain)}
.k-anchor{--kc:var(--anchor);--ki:var(--anchor-ink)} .k-meal{--kc:var(--meal);--ki:var(--meal-ink)} .k-hotel{--kc:var(--hotel);--ki:var(--hotel-ink)} .k-flight{--kc:var(--flight);--ki:var(--ink)} .k-plain{--kc:var(--plain);--ki:var(--ink3)}
.tm{text-align:right;padding:6px 0;font-family:var(--num);font-variant-numeric:tabular-nums;line-height:1.1}
.tm .t1{display:block;font-size:20px;font-weight:700}
.tm .t2{display:block;font-size:14px;font-weight:500;color:var(--ink3)}
.rail{display:flex;flex-direction:column;align-items:center}
.rail .seg{display:block;width:4px;height:10px;background:var(--kc)}
.rail .grow{flex:1;height:auto}
.rail .dot{display:block;flex:0 0 auto;width:15px;height:15px;border-radius:50%;border:4px solid var(--kc);background:var(--card)}
.bd{padding:6px 0 9px;min-width:0;display:flex;flex-direction:column;gap:1px}
.kd{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--ki)}
.kd .nowtag{font-size:12px;letter-spacing:.1em}
.ttl{font-size:16px;font-weight:700;line-height:1.4}
.pl{font-size:13.5px;line-height:1.45;color:var(--ink2)}
.cs{font-size:13.5px;line-height:1.45;font-weight:600}
.nt{font-size:13px;line-height:1.45;color:var(--ink3)}
.rem{font-size:13px;line-height:1.45;color:var(--ink2);margin-top:1px}
.rem b{color:var(--warn-fg);margin-right:6px}
.bd .acts{margin-top:5px}
.k-move .tm{padding:4px 0}
.k-move .tm .t1{font-size:17px;font-weight:600;color:var(--ink3)}
.k-move .rail .seg{flex:1;height:auto;width:0;background:none;border-left:3px dotted var(--move)}
.k-move .bd{padding:5px 0 6px}
.mv{font-size:13px;line-height:1.45;color:var(--ink2)}
/* leg = travel time + distance for every point-to-point move */
.lg{display:flex;align-items:center;flex-wrap:wrap;gap:2px 6px;margin-top:2px;font-size:12.5px;line-height:1.4;color:var(--ink3)}
.lg svg{flex:0 0 auto;width:13px;height:13px}
.lg b{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;color:var(--ink2)}
.lg i{font-style:normal;color:var(--line2)}
.k-flight .lg,.k-flight .lg b{color:var(--on-flight2)}
/* anchor = the day's highlight: same type scale as other rows, marked by colour only (tinted panel, solid label, blue title/time, filled dot) */
.k-anchor .bd{background:var(--anchor-bg);border-radius:12px;padding:9px 11px 11px;margin:5px 0;gap:2px}
.k-anchor .kl{background:var(--anchor);color:var(--on-link);border-radius:4px;padding:1px 7px;letter-spacing:.12em}
.k-anchor .ttl{color:var(--anchor-ink)}
.k-anchor .tm{padding-top:12px}
.k-anchor .tm .t1{color:var(--anchor-ink)}
.k-anchor .rail .seg:first-child{height:16px}
.k-anchor .rail .dot{background:var(--anchor)}
.k-anchor .act{background:var(--card);border-color:transparent}
.k-anchor .pd{background:var(--card);border-color:transparent}
/* ── Colour hierarchy (strongest → weakest) ──
   T1 航班／高鐵 = filled boarding-pass panel (navy on light, light on dark) + plane/train dot
   T1b 機場／車站流程 (報到・出境・入境・轉機・候車) = flight-coloured rail + label, no panel
   T2 重點 = light blue tint panel · T3 用餐 = orange · T4 飯店 = green · T5 其他 = grey, transit dotted
   State colours are separate: yellow = NOW／今天, amber = 注意, red = 緊急 only. Type size is the same on every tier. */
.k-air{--kc:var(--flight);--ki:var(--flight)}
.k-flight .bd{background:var(--flight-bg);border-radius:12px;padding:9px 11px 11px;margin:5px 0;gap:2px}
.k-flight .kd{color:var(--on-flight)}
.k-flight .kl{background:var(--on-flight);color:var(--flight-bg);border-radius:4px;padding:1px 7px;letter-spacing:.12em}
.k-flight .ttl,.k-flight .pl,.k-flight .cs{color:var(--on-flight)}
.k-flight .nt,.k-flight .rem{color:var(--on-flight2)}
.k-flight .rem b{color:var(--on-flight)}
.k-flight .tm{padding-top:12px}
.k-flight .tm .t1{color:var(--flight)}
.k-flight .rail .seg:first-child{height:14px}
.k-flight .rail .dot{width:22px;height:22px;border:0;background:var(--flight-bg);color:var(--on-flight);display:flex;align-items:center;justify-content:center}
.k-flight .rail .dot svg{width:13px;height:13px}
.k-flight .act{border-color:var(--on-flight2);color:var(--on-flight)}
.k-flight .act svg{color:var(--on-flight)}
.k-flight .pd{border-color:var(--on-flight2);color:var(--on-flight)}
.k-flight .pd dt,.k-flight .pd summary span{color:var(--on-flight2)}
.k-flight .pd dd{color:var(--on-flight)}
.cur.k-flight .rail .dot{background:var(--signal);color:var(--on-signal)}
.past.k-flight .bd{opacity:.6}
.past.k-flight .ttl{color:var(--on-flight)}
/* flight days at day level: header strip, date-strip plane mark, 行程 list */
.flh{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.flh li{display:flex;align-items:center;gap:8px;background:var(--board2);border:1px solid var(--board-btn);border-radius:8px;padding:5px 10px;font-size:13.5px;color:var(--on-board);min-width:0}
.flh svg{flex:0 0 auto;width:14px;height:14px;color:var(--on-board)}
.flh b{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flh .num{margin-left:auto;flex:0 0 auto;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:17px;font-weight:600}
.dd.fl small::after{content:"";display:inline-block;width:10px;height:10px;margin-left:3px;vertical-align:-1px;background:currentColor;-webkit-mask:var(--plane-m) center/contain no-repeat;mask:var(--plane-m) center/contain no-repeat}
.dd.tr small::after{content:"";display:inline-block;width:10px;height:10px;margin-left:3px;vertical-align:-1px;background:currentColor;-webkit-mask:var(--train-m) center/contain no-repeat;mask:var(--train-m) center/contain no-repeat}
.dayrow .dfl{color:var(--flight)}
.dayrow .dfl.tr::before{-webkit-mask-image:var(--train-m);mask-image:var(--train-m)}
.dayrow .dfl::before{content:"";display:inline-block;width:11px;height:11px;margin-right:5px;vertical-align:-1px;background:currentColor;-webkit-mask:var(--plane-m) center/contain no-repeat;mask:var(--plane-m) center/contain no-repeat}
.cur .rail .dot{background:var(--signal);border-color:var(--ink)}
.cur .tm .t1{text-decoration:underline;text-decoration-color:var(--signal);text-decoration-thickness:4px;text-underline-offset:3px}
.past .rail .dot{border-color:var(--line2);background:var(--line2)}
.past .rail .seg{background:var(--line2)}
.past .ttl{color:var(--ink2)}
.nowline{display:grid;grid-template-columns:54px minmax(0,1fr);column-gap:8px;align-items:center;margin:2px 0}
.nowline span{font-family:var(--num);font-weight:700;letter-spacing:.1em;text-align:right;font-size:14px}
.nowline hr{border:0;border-top:3px solid var(--signal);margin:0}

/* place details */
.pd{margin-top:4px;border:1px solid var(--line);border-radius:8px}
.pd summary{min-height:32px;list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:3px 10px;font-weight:700;font-size:13.5px}
.pd summary::-webkit-details-marker{display:none}
.pd summary span{font-weight:400;font-size:12px;color:var(--ink3);margin-left:auto;white-space:nowrap}
.pd summary svg{width:15px;height:15px;flex:0 0 auto}
.pd[open] summary svg{transform:rotate(180deg)}
.pd dl{display:grid;grid-template-columns:2.6em minmax(0,1fr);gap:2px 10px;margin:0;padding:0 10px 4px;font-size:13px;line-height:1.45}
.pd dt{color:var(--ink3)}
.pd dd{margin:0;color:var(--ink);overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.pd .act{margin:4px 10px 10px}

/* sections & lists */
.card{background:var(--card);border-radius:14px;padding:10px 12px}
.card h2{margin:0 0 2px;font-size:16.5px;font-weight:700}
.rows{list-style:none;margin:0;padding:0}
.rows>li{padding:8px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:1px}
.rows>li:first-child{border-top:0;padding-top:4px}
.ra{font-weight:700;font-size:15px}
.rb{font-size:13px;line-height:1.5;color:var(--ink2);white-space:pre-line}
.hint{margin:0;font-size:12.5px;color:var(--ink3)}
.wxall{margin:0;font-size:13.5px;color:var(--ink2)}
.wxall b{color:var(--ink);margin-right:8px}

/* plan day list */
.days{list-style:none;margin:0;padding:0;background:var(--card);border-radius:14px;overflow:hidden}
.days li+li{border-top:1px solid var(--line)}
.dayrow{width:100%;min-height:48px;border:0;background:none;cursor:pointer;display:grid;grid-template-columns:54px minmax(0,1fr) 16px;gap:10px;align-items:center;padding:7px 12px;text-align:left}
.dayrow .dt{display:flex;flex-direction:column;line-height:1.1}
.dayrow .dt b{font-family:var(--num);font-size:20px;font-weight:700}
.dayrow .dt small{font-size:12px;color:var(--ink3)}
.dayrow .d1{display:block;font-size:15px;font-weight:700}
.dayrow .d2{display:block;font-size:12.5px;line-height:1.45;color:var(--ink2)}
.dayrow .dfl{display:block;font-size:12.5px;line-height:1.45;font-weight:700;color:var(--anchor-ink);font-variant-numeric:tabular-nums}
.wide{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.wide svg{width:15px;height:15px}
.dayrow.td{background:var(--warn-bg)}
.dayrow.td .dt small{color:var(--ink);font-weight:700}

/* info */
.sosg{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.sos{min-height:56px;border-radius:10px;background:var(--sos);color:var(--on-sos);text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sos b{font-family:var(--num);font-size:26px;line-height:1}
.sos span{font-size:12px;font-weight:700}
.sosx{list-style:none;margin:0;padding:0;font-size:13px;line-height:1.45;color:var(--on-board2)}
.sosx b{color:var(--on-board);margin-right:8px}
.hcard{background:var(--board2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.hcard .lab{font-family:var(--num);font-weight:700;letter-spacing:.12em;color:var(--signal);font-size:13px}
.hcard .hn{font-size:16px;font-weight:700}
.hcard .ha{font-size:13px;line-height:1.45;color:var(--on-board2);-webkit-user-select:text;user-select:text}
.hcard .acts{margin-top:4px}
.hcard .acts .act{border-color:var(--board-btn);color:var(--on-board2)}
.hcard .acts .act svg{color:var(--on-board2)}
.acc{background:var(--card);border-radius:14px}
.acc summary{min-height:44px;list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:5px 12px}
.acc summary::-webkit-details-marker{display:none}
.acc summary .sx{flex:1;min-width:0;line-height:1.3}
.acc summary b{display:block;font-size:15px}
.acc summary small{display:block;font-size:12px;color:var(--ink3)}
.acc[open] summary svg{transform:rotate(180deg)}
.acc .rows{padding:0 12px 8px}
table.bud{border-collapse:collapse;font-size:13.5px;margin:0 12px 10px;width:calc(100% - 24px)}
table.bud td{padding:5px 0;border-top:1px solid var(--line);vertical-align:top}
table.bud td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:12px}
table.bud tr:first-child td{border-top:0}
table.bud tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
/* ── 資訊 page: ordered by when the info is needed ── */
.ihd-sub{margin:0;font-size:13px;color:var(--on-board2)}
.ihd-sub b{color:var(--signal);font-family:var(--num);font-size:18px;margin:0 2px}
.jump{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:0 0 auto;min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--ink2);font-size:13px;font-weight:600;cursor:pointer}
.isec{display:flex;flex-direction:column;gap:6px;scroll-margin-top:12px}
.sec-h{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px 8px;padding:0 2px}
.sec-h h2{margin:0;font-size:16.5px;font-weight:700}
.sec-h small{font-size:12.5px;color:var(--ink3)}
.todo{list-style:none;margin:0;padding:2px 12px;background:var(--card);border-radius:14px}
.todo li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.todo li:first-child{border-top:0}
.ck{width:24px;height:24px;margin-top:1px;border-radius:7px;border:1.5px solid var(--line2);background:transparent;color:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ck svg{width:14px;height:14px}
.ck:disabled{cursor:default}
.todo li.is-done .ck{background:var(--hotel);border-color:var(--hotel);color:var(--card)}
.todo li.is-done .ra{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--line2)}
.todo li.is-done .rb,.todo li.is-done .acts{display:none}
.grp{display:inline-block;font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.06em;margin-right:6px}
.dl{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap;margin-top:2px}
.dl.now,.dl.late{background:var(--warn-bg);color:var(--warn-fg)}
.dl.soon{background:var(--link-bg);color:var(--link)}
.dl.later{background:var(--bg);color:var(--ink3)}
.acc .todo{padding:0 12px 6px;border-radius:0}
.fcs{display:flex;flex-direction:column;gap:6px}
.fc{display:grid;grid-template-columns:50px minmax(0,1fr);gap:10px;background:var(--card);border-radius:12px;padding:10px}
.fc-d{background:var(--flight-bg);color:var(--on-flight);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0;line-height:1.15;align-self:start}
.fc-d b{font-family:var(--num);font-size:17px;font-weight:700}
.fc-d small{font-size:11px;color:var(--on-flight2)}
.fc-m{min-width:0;display:flex;flex-direction:column;gap:1px}
.fc-t{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px}
.fc-t svg{flex:0 0 auto;width:14px;height:14px;color:var(--flight)}
.fc-time{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:20px;font-weight:700;line-height:1.2}
.fc-r,.fc-n{font-size:13px;line-height:1.45;color:var(--ink2);white-space:pre-line}
.fc.past{opacity:.55}
.pnr{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink3)}
.pnr b{font-family:var(--num);font-size:18px;letter-spacing:.06em;color:var(--ink)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--board);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.nb{min-height:46px;border:0;background:none;color:var(--on-board2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11.5px;font-weight:500}
.nb svg{width:22px;height:22px}
.nb[aria-current="page"]{color:var(--signal);font-weight:700}

/* driver mode */
.driver{position:fixed;inset:0;z-index:20;background:var(--card);color:var(--ink);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.driver[hidden]{display:none}
.dv-top{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13.5px;color:var(--ink3)}
.dv-back{min-height:44px;border:0;background:none;color:var(--link);font-size:16px;font-weight:700;display:inline-flex;align-items:center;gap:4px;cursor:pointer;padding:0 6px}
.dv-main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:16px 8px;font-family:var(--sc)}
.dv-main p{margin:0}
.dv-ask{font-size:21px;font-weight:700;color:var(--ink2)}
.dv-name{font-size:clamp(40px,13vw,72px);line-height:1.15;font-weight:900;overflow-wrap:anywhere}
.dv-addr{font-size:clamp(26px,7.5vw,40px);line-height:1.35;font-weight:700;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.dv-tel{font-size:22px;font-weight:700;color:var(--ink2);-webkit-user-select:text;user-select:text}
.dv-foot{display:flex;flex-direction:column;gap:10px}
.dv-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.dv-chip{flex:0 0 auto;min-height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line2);background:var(--card);color:var(--ink);font-size:15px;cursor:pointer;font-family:var(--sc)}
.dv-chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card);font-weight:700}
.dv-foot .acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
.dv-foot .act{min-height:42px;font-size:15px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px)}
.toast.on{opacity:1}

/* ── 餐廳 tab: collapsible sections (cascade) → meal plan / ranked rows → backups & address ── */
.fsec{scroll-margin-top:12px}
.fsec>summary{min-height:50px}
.fsec>summary b{font-size:16px}
.fsec>summary .cnt{font-family:var(--num);font-size:18px;font-weight:700;color:var(--ink3);margin-left:auto;padding-right:2px}
.jump .xall{border-style:dashed;color:var(--ink3)}
.fgrp{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:8px 2px 0}
.fgrp h2{margin:0;font-size:17px;font-weight:800}
.fgrp small{font-size:12.5px;color:var(--ink3)}
.ff{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.ff button{flex:1;min-width:0;min-height:36px;border:0;border-radius:9px;background:none;color:var(--ink2);font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;padding:0 4px}
.ff button small{font-family:var(--num);font-size:14px;font-weight:600;margin-left:3px;color:var(--ink3)}
.ff button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.ff button[aria-pressed="true"] small{color:inherit;opacity:.75}
.ftip{margin:0;font-size:13px;line-height:1.5;color:var(--ink2);background:var(--card);border-radius:10px;padding:8px 12px}
.ftip b{color:var(--ink);margin-right:6px}
.fempty{margin:0;padding:14px;text-align:center;font-size:13.5px;color:var(--ink3);background:var(--card);border-radius:14px}

/* meal plan */
.mplan{padding:0 0 6px}
.mplan .pastb{margin:0 12px 6px;width:calc(100% - 24px);border:1px solid var(--line)}
.mday{border-top:1px solid var(--line)}
.mday:first-of-type{border-top:0}
.mdh{width:100%;min-height:36px;border:0;background:none;display:flex;align-items:center;gap:8px;padding:8px 12px 0;cursor:pointer;text-align:left;color:var(--ink)}
.mdh b{font-family:var(--num);font-size:18px;font-weight:700}
.mdh small{font-size:12.5px;color:var(--ink3)}
.mdh .t{flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mdh .go{flex:0 0 auto;font-size:12px;color:var(--link);display:inline-flex;align-items:center}
.mdh .go svg{width:14px;height:14px}
.mdh .tg{font-family:var(--num);font-weight:700;letter-spacing:.1em;background:var(--signal);color:var(--on-signal);border-radius:4px;padding:0 6px;font-size:13px;line-height:1.5}
.mday.past{opacity:.6}
.mls{list-style:none;margin:0;padding:0}
.ml{display:grid;grid-template-columns:46px minmax(0,1fr);column-gap:10px;padding:6px 12px 8px}
.ml-tm{text-align:right;line-height:1.1;padding-top:3px}
.ml-tm b{display:block;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:18px;font-weight:700;color:var(--meal-ink)}
.ml-tm small{display:block;font-size:11.5px;font-weight:700;color:var(--meal-ink);margin-top:2px}
.ml-bd{min-width:0;display:flex;flex-direction:column;gap:2px;border-left:3px solid var(--meal);padding-left:10px}
.ml-n{font-size:15.5px;font-weight:700;line-height:1.4}
.ml-m{font-size:13px;line-height:1.45;color:var(--ink2)}
.ml-m .ok{color:var(--hotel-ink);font-weight:700}
.ml .acts{margin-top:4px}
.vtag{display:inline-block;font-size:11.5px;font-weight:700;line-height:1.6;padding:0 6px;border-radius:4px;border:1px solid var(--line2);color:var(--ink3);margin-left:6px;vertical-align:2px;white-space:nowrap}
.rk{font-family:var(--num);font-size:14.5px;font-weight:700;color:var(--ink3);margin-left:6px;white-space:nowrap}
.bk{margin-top:5px;border:1px solid var(--line);border-radius:8px}
.bk summary{min-height:34px;list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:3px 10px;font-size:13px}
.bk summary::-webkit-details-marker{display:none}
.bk summary b{flex:0 0 auto;font-weight:700}
.bk summary span{flex:1;min-width:0;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk summary svg{width:15px;height:15px;flex:0 0 auto}
.bk[open] summary svg{transform:rotate(180deg)}
.bk ol{list-style:none;margin:0;padding:2px 10px 10px;display:flex;flex-direction:column;gap:8px}
.bk li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px;font-size:13px;line-height:1.45}
.bk .bn{font-family:var(--num);font-weight:700;font-size:15px;color:var(--ink3);line-height:1.3}
.bk .bt{font-weight:700;color:var(--ink)}
.bk .bx{color:var(--ink2)}
.bk .acts{margin-top:4px}
.mplan .wide{display:flex;align-items:center;justify-content:center;gap:6px;margin:6px 12px 4px;width:calc(100% - 24px)}
.mplan .wide svg{width:16px;height:16px}

/* ranked list */
.frs{padding:0 12px 4px}
.fr{border-top:1px solid var(--line)}
.fr:first-child{border-top:0}
.fr summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr) 18px;column-gap:8px;align-items:start;padding:9px 0}
.fr summary::-webkit-details-marker{display:none}
.fr-rk{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:24px;font-weight:700;line-height:1;text-align:center;color:var(--ink3);padding-top:1px}
.fs0 .fr-rk{color:var(--meal-ink)}
.fr-sx{min-width:0;display:flex;flex-direction:column;gap:1px}
.fr-n{font-size:15.5px;font-weight:700;line-height:1.35}
.fr-d{font-size:13px;line-height:1.4;color:var(--ink2)}
.fr-c{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.ch{font-size:12px;line-height:1;padding:4px 6px;border-radius:6px;background:var(--bg);color:var(--ink2);white-space:nowrap}
.ch.on{background:var(--meal-ink);color:var(--card);font-weight:700}
.ch.alt{background:none;border:1px solid var(--meal);color:var(--meal-ink);padding:3px 5px;font-weight:600}
.fr summary>svg{width:18px;height:18px;color:var(--ink3);margin-top:3px}
.fr[open] summary>svg{transform:rotate(180deg)}
.fr-bd{padding:0 0 12px 36px;display:flex;flex-direction:column;gap:4px}
.fr-bd p{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink2)}
.fr-bd dl{display:grid;grid-template-columns:2.6em minmax(0,1fr);gap:2px 10px;margin:2px 0 0;font-size:13px;line-height:1.45}
.fr-bd dt{color:var(--ink3)}
.fr-bd dd{margin:0;color:var(--ink);overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.fr-bd .acts{margin-top:4px}
.nr>li .ra{font-size:14px}
/* nested summaries inside an open section must not inherit the section chevron rotation */
.fsec .fr summary>svg,.fsec .bk summary svg{transform:none}
.fsec .fr[open] summary>svg,.fsec .bk[open] summary svg{transform:rotate(180deg)}

@media (prefers-reduced-motion: reduce){.toast{transition:none}}

/* ---- v2 ---- */
:root{--ferry-m:url("data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2024%2024%22%20fill=%22none%22%20stroke=%22black%22%20stroke-width=%222.6%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22%3E%3Cpath%20d=%22M3%2016l2.5%204h13L21%2016l-9-3z%22/%3E%3Cpath%20d=%22M6%2014.5V9h12v5.5%22/%3E%3Cpath%20d=%22M12%203v6%22/%3E%3C/svg%3E");--bus-m:url("data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2024%2024%22%20fill=%22none%22%20stroke=%22black%22%20stroke-width=%222.6%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22%3E%3Crect%20x=%225%22%20y=%223%22%20width=%2214%22%20height=%2215%22%20rx=%222.5%22/%3E%3Cpath%20d=%22M5%2011h14M8%2021v-3M16%2021v-3%22/%3E%3C/svg%3E")}
.dd.fe small::after,.dd.bu small::after{content:"";display:inline-block;width:10px;height:10px;margin-left:3px;vertical-align:-1px;background:currentColor;-webkit-mask:var(--ferry-m) center/contain no-repeat;mask:var(--ferry-m) center/contain no-repeat}
.dd.bu small::after{-webkit-mask-image:var(--bus-m);mask-image:var(--bus-m)}
.dayrow .dfl.fe::before{-webkit-mask-image:var(--ferry-m);mask-image:var(--ferry-m)}
.dayrow .dfl.bu::before{-webkit-mask-image:var(--bus-m);mask-image:var(--bus-m)}
.dayrow .dfl.tr::before{-webkit-mask-image:var(--train-m);mask-image:var(--train-m)}
.dayrow .dfl .fr{margin-right:8px}
.dayrow .dfl .ft{display:inline-block;white-space:nowrap;font-family:var(--num);font-size:14px}
.dayrow .dt .wxs{margin-top:3px;font-family:var(--num);font-size:13px;color:var(--ink3);white-space:nowrap}
.days li.sg{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px;padding:9px 12px 7px;background:var(--bg);border-top:1px solid var(--line)}
.days li.sg:first-child{border-top:0}
.days li.sg b{font-size:14px;font-weight:800;letter-spacing:.02em}
.days li.sg small{font-size:12px;color:var(--ink3)}
.days li.sg+li{border-top:0}
/* compact place row: name toggles details, map stays one tap away */
.pq{display:flex;align-items:flex-start;gap:6px;margin-top:5px}
.pq .pd{flex:1 1 auto;min-width:0;margin:0}
.pd summary{min-height:44px}
.pd summary .pn{min-width:0;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd[open] summary .pn{white-space:normal}
.pd .acts{margin:2px 10px 10px}
.pd .acts .act{margin:0}
.pq .pq-map{flex:0 0 auto;min-height:44px}
.pq .act{min-height:40px}
.k-flight .pq .pq-map{border-color:var(--on-flight2);color:var(--on-flight)}
.k-flight .pq .pq-map svg{color:var(--on-flight)}
.ml-m .ok,.ml-m .need{white-space:nowrap}
.ml-m .need{color:var(--warn-fg);font-weight:700}
/* backups */
.bkd{border:1px solid var(--line);border-radius:12px;background:var(--card)}
.bkd summary{min-height:44px;list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:4px 12px;font-size:14px}
.bkd summary::-webkit-details-marker{display:none}
.bkd summary span{flex:1;color:var(--ink3);font-size:12.5px}
.bkd summary svg{flex:0 0 auto}
.bkd[open] summary svg{transform:rotate(180deg)}
.bkl{list-style:none;margin:0;padding:0 12px 10px;display:flex;flex-direction:column;gap:6px}
.bkd .bkl{padding-top:2px}
.bkl li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:baseline;font-size:13.5px;line-height:1.5;color:var(--ink2)}
.rows .bkl{padding:4px 0 0}
.bkh{padding:2px 12px 2px;font-size:12.5px;font-weight:700;color:var(--ink3)}
.bt{font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:4px;white-space:nowrap;border:1px solid currentColor}
.bt-r{color:var(--link)}.bt-t{color:var(--hotel-ink)}.bt-o{color:var(--warn-fg)}

/* ---- site v3: readability, touch targets, home link ---- */

  train:sv(13,'<rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M9 21l-2-4M15 21l2-4"/>'),
  ferry:sv(13,'<path d="M3 16l2.5 4h13L21 16l-9-3z"/><path d="M6 14.5V9h12v5.5"/><path d="M12 3v6"/>'),

};
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const AIR=/報到|出境|入境|轉機|安檢|候車|登機|領行李/;
const hasFl=d=>d.items.some(it=>it[2]==='flight');
const MICON=t=>({fl:I.plane,tr:I.train,fe:I.ferry,bu:I.bus})[tmode(t)];
/* short route label for the header chips: code / operator + stop codes, never the long title */
function shortLab(f){const t=clean(f[3]),m=t.match(CODE),pl=String(f[4]||'').replace(/\s*T\d\b/g,'').replace(/[（(][^）)]*[）)]/g,'').trim();
  const okPl=/^[^→]+→/.test(pl);if(m&&okPl)return m[1]+' '+pl;
  const body=t.replace(/^(火車|渡輪|巴士|高鐵)\s*/,''),rt=body.match(/(\S+\s*→.*)$/),op=rt?body.slice(0,rt.index).trim():body;
  return okPl?(op+' '+pl).trim():body;}
let REMSEEN=null,PREVP=null;
const flMode=d=>{const ms=d.items.filter(it=>it[2]==='flight').map(f=>tmode(f[3]));return !ms.length?'':' '+(['fl','fe','tr','bu'].find(m=>ms.includes(m)));};
function flHead(day){const fs=day.items.filter(it=>it[2]==='flight');if(!fs.length)return'';
  return `<ul class="flh" aria-label="今日交通">${fs.map(f=>{const p1=f[1]&&mins(f[1])<mins(f[0])?'（+1）':'';
    return `<li>${MICON(f[3])}<b>${esc(shortLab(f))}</b><span class="num">${esc(f[0])}${f[1]?' → '+esc(f[1])+p1:''}</span></li>`;}).join('')}</ul>`;}
function clean(t){return String(t??'').replace(/^[✅➡⬅-⬇️‍\s]+/,'');}
function localNow(){const n=new Date();return new Date(n.getTime()+n.getTimezoneOffset()*60000+TRIP.utcOffset*3600000);}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function mins(s){if(!s)return null;const [h,m]=s.split(':').map(Number);return h*60+m;}
/* leg: o.km = route distance (km); o.min overrides the row span when the row also holds a stop or a time-zone change */
function legMin(it){const o=it[7]||{};if(o.min!=null)return o.min;if(!it[1])return null;let d=mins(it[1])-mins(it[0]);if(d<0)d+=1440;return d;}
const fmtMin=d=>d==null?'':d<60?d+' 分':Math.floor(d/60)+' 小時'+(d%60?' '+d%60+' 分':'');
const fmtKm=k=>(k>=1000?k.toLocaleString('en-US'):String(k))+' km';
function legText(it){const o=it[7]||{};if(o.km==null)return'';const d=legMin(it);return (d!=null?fmtMin(d)+'・':'')+'約 '+fmtKm(o.km);}
function legHTML(it){const o=it[7]||{};if(o.km==null)return'';const d=legMin(it);
  return `<div class="lg">${sv(13,'<path d="M5 19c3-6 11-2 14-14"/><circle cx="5" cy="19" r="1.5"/><circle cx="19" cy="5" r="1.5"/>')}${d!=null?`<span>${fmtMin(d).replace(/\d+/g,m=>'<b>'+m+'</b>')}</span><i>·</i>`:''}<span>約 <b>${esc(fmtKm(o.km).replace(' km',''))}</b> km</span></div>`;}
function dayDiff(a,b){return Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/86400000);}
function fmtLeft(m){return m<60?`${m} 分`:`${Math.floor(m/60)} 小時 ${m%60} 分`;}
function show(msg){toast.textContent=msg;toast.classList.add('on');clearTimeout(show.t);show.t=setTimeout(()=>toast.classList.remove('on'),1800);}
async function copy(text,msg){
  try{await navigator.clipboard.writeText(text);show(msg||'已複製');}
  catch(e){const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();
    try{document.execCommand('copy');show(msg||'已複製');}catch(_){show('無法複製，請長按文字選取');}document.body.removeChild(t);}
}
const hotelReady=!!(HOTEL.addr&&!/^待/.test(HOTEL.addr));
/* normalized [start,end] minutes per item; handles rows after midnight and open-ended rows */
function spans(day){let prev=-1,off=0;return day.items.map(it=>{let s=mins(it[0]);if(s==null)s=Math.max(prev,0);else{s+=off;if(s<prev){off+=1440;s+=1440;}}
  let e=mins(it[1]);if(e==null)e=s+60;else{e+=off;while(e<=s)e+=1440;}prev=s;return [s,e];});}
function state(i){const day=DAYS[i],sp=spans(day),j=localNow(),nm=j.getHours()*60+j.getMinutes(),isToday=todayIdx>=0&&day.d===DAYS[todayIdx].d;let cur=-1,next=-1;const past=[];
  if(isToday)sp.forEach(([s,e],k)=>{if(nm>=e)past.push(k);else if(nm>=s&&cur<0)cur=k;else if(s>nm&&next<0)next=k;});
  return {day,sp,nm,isToday,cur,next,past};}

function placeActs(k,inBoard){const p=PLACES[k];if(!p)return'';
  return `<div class="acts"><a class="act pri" href="${M(p.q,p.c)}" target="_blank" rel="noopener">${I.pin}${MAPLABEL}</a><button type="button" class="act" data-drv="${esc(k)}">${I.car}給司機看</button>${inBoard?`<button type="button" class="act" data-copy="${esc(p.n+'\n'+(p.a||''))}">${I.copy}複製地址</button>`:''}${p.t?`<a class="act" href="tel:${esc(p.t)}">${I.phone}撥打</a>`:''}</div>`;}
function placeBlock(k,dk){const p=PLACES[k];if(!p)return'';
  let h='';if(p.x&&!(REMSEEN&&REMSEEN.has(k))){h+=`<div class="rem"><b>提醒</b>${esc(p.x)}</div>`;if(REMSEEN)REMSEEN.add(k);}
  h+=`<div class="pq"><details class="pd" data-dk="${esc(dk)}"><summary><span class="pn">${esc(p.n)}</span>${I.chev}</summary><dl>`+
    (p.a?`<dt>地址</dt><dd>${esc(p.a)}</dd>`:'')+(p.h?`<dt>營業</dt><dd>${esc(p.h)}</dd>`:'')+(p.ts?`<dt>電話</dt><dd>${esc(p.ts)}</dd>`:'')+
    `</dl>${placeActs(k,true)}</details><a class="act pri pq-map" href="${M(p.q,p.c)}" target="_blank" rel="noopener">${I.pin}${MAPLABEL}</a></div>`;
  return h;}
function hotelActs(full){const cp=full||!hotelReady;return `<div class="acts"><a class="act" href="${M(HOTEL.q)}" target="_blank" rel="noopener">${I.pin}${full?'飯店地圖':'地圖'}</a>${hotelReady?`<button type="button" class="act" data-drv="@hotel">${I.car}給司機看</button>`:''}${cp?`<button type="button" class="act" data-copy="${esc(HOTEL.name+'\n'+HOTEL.addr)}">${I.copy}${full?'複製飯店地址':'複製地址'}</button>`:''}</div>`;}
function chips(o,dk){if(o.p&&o.p===PREVP)return o.hotel?hotelActs():'';return (o.p?placeBlock(o.p,dk):'')+(o.hotel?hotelActs():'');}
function dayText(day){let s=`【${day.tab}（${day.wd}）${day.title}】\n${day.wx||''}\n`;
  day.items.forEach(it=>{const [a,b,,t,pl,c,,x]=it;const p=x&&x.p?PLACES[x.p]:null;const lt=legText(it);s+=`${a}${b?'–'+b:''} ${clean(t)}${pl?'｜'+pl:''}${lt?'｜'+lt:''}${c?'｜'+c:''}\n`;if(p&&p.a)s+=`　　${p.n}｜${p.a}\n`;});return s.trim();}

let todayIdx=-1,current='plan',showPast=false;
const isTd=k=>todayIdx>=0&&DAYS[k].d===DAYS[todayIdx].d;

function strip(active){return `<div class="strip" role="tablist" aria-label="選擇日期">`+DAYS.map((d,k)=>`<button type="button" role="tab" class="dd${flMode(d)}${isTd(k)?' td':''}" aria-selected="${k===active}" data-go="d${k}"><b>${esc(d.tab)}</b><small>${d.alt?'備案':isTd(k)?'今天':esc(d.wd)}</small></button>`).join('')+'</div>';}
function countdown(){const t=ymd(localNow());const n=dayDiff(t,DAYS[0].d);return n>0?`<p class="cd">距離出發還有<b>${n}</b>天</p>`:'';}

function board(S){const {day,sp,nm,cur,next}=S;if(cur<0&&next<0)return'';let b='<section class="nowb" aria-label="現在與下一個">';
  if(cur>=0){const it=day.items[cur],o=it[7]||{},p=o.p?PLACES[o.p]:null,[s,e]=sp[cur],pct=Math.max(0,Math.min(100,Math.round((nm-s)/(e-s)*100)));
    const sub=[it[4],legText(it),it[5]].filter(Boolean).join(' · ');const rem=(p&&p.x)||it[6];
    b+=`<div class="nrow"><span class="tag">NOW</span><span class="big">${esc(it[0])}${it[1]?'–'+esc(it[1]):''}</span><span class="left">還有 ${fmtLeft(e-nm)}</span></div>
      <div class="nt1">${esc(clean(it[3]))}</div>${sub?`<div class="nsub">${esc(sub)}</div>`:''}${rem?`<div class="nrem">${esc(rem)}</div>`:''}
      <div class="bar"><i style="width:${pct}%"></i></div>${p?placeActs(o.p,true):(o.hotel||it[2]==='hotel')?hotelActs():''}`;}
  if(next>=0){const it=day.items[next];b+=`<div class="next"${cur<0?' style="border-top:0;padding-top:0"':''}><span class="tag2">NEXT</span><span class="nt2">${esc(it[0])}</span><span>${esc(clean(it[3]))}${it[4]?' · '+esc(it[4]):''}</span></div>`;}

  const others=INFO.filter(s=>s!==sos&&s.rows&&s.rows.length&&!SEC_TODO.test(s.h)&&!SEC_FL.test(s.h)&&!SEC_PAY.test(s.h)&&!SEC_PLAN.test(s.h)&&!DINING().includes(s)&&!isPointer(s)&&!isDir(s));
  parts.other=others.map((s,k)=>accHTML('sec-o'+k,s.h,s.rows.slice(0,2).map(r=>r.a||'').filter(Boolean).join(' · '),rowsHTML(s.rows,'o'+k),false)).join('');
  if(BUDGET&&BUDGET.rows.length){parts.bud=accHTML('sec-bud','預算（每人）',BUDGET.total?BUDGET.total[1]:'',`<table class="bud">`+BUDGET.rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')+(BUDGET.total?`<tr class="tot"><td>${esc(BUDGET.total[0])}</td><td>${esc(BUDGET.total[1])}</td></tr>`:'')+`</table>`,false);jump.push(['sec-bud','預算']);}
  const plan=INFO.find(s=>SEC_PLAN.test(s.h)&&s.rows&&s.rows.length);
  if(plan){parts.plan=accHTML('sec-plan','規劃說明',`規劃時的取捨與限制・${plan.rows.length} 項`,rowsHTML(plan.rows,'pl'),false);jump.push(['sec-plan','規劃']);}
  const order=pre?['todo','fl','pay','other','bud','plan']:['fl','pay','other','todo','bud','plan'];
  const jo=order.map(k=>({todo:'sec-todo',fl:'sec-fl',pay:'sec-pay',bud:'sec-bud',plan:'sec-plan'})[k]).filter(Boolean);
  jump.sort((a,b)=>jo.indexOf(a[0])-jo.indexOf(b[0]));
  if(jump.length>2)h+=`<nav class="jump" aria-label="跳到">${jump.map(([id,l])=>`<button type="button" data-jump="${id}">${l}</button>`).join('')}</nav>`;
  h+=order.map(k=>parts[k]||'').join('');
  view.innerHTML=h+'</div>';}
document.addEventListener('click',e=>{const t=e.target;if(!t.closest)return;
  const j=t.closest('[data-jump]');if(j){const el=document.getElementById(j.dataset.jump);if(el){if(el.tagName==='DETAILS')el.open=true;el.scrollIntoView({block:'start'});}return;}
  const b=t.closest('.ck');if(!b||b.disabled)return;const li=b.closest('li');const k=li.dataset.tk;const s=doneSet();const on=!li.classList.contains('is-done');
  on?s.add(k):s.delete(k);saveDone(s);li.classList.toggle('is-done',on);b.setAttribute('aria-pressed',String(on));
  const c=document.getElementById('todo-n');if(c)c.textContent=document.querySelectorAll('.todo li:not(.is-done)').length;});

function dayNavTarget(){if(todayIdx>=0)return 'd'+todayIdx;const t=ymd(localNow());return dayDiff(t,DAYS[0].d)>0?'d0':'d'+(DAYS.length-1);}
function renderNav(){const inTrip=todayIdx>=0;
  const key=current==='plan'||current==='food'||current==='info'?current:(inTrip&&current!=='d'+todayIdx?'plan':'day');
  const items=[['plan','plan','行程',I.cal],['day',dayNavTarget(),inTrip?'今天':'每日',I.clock]].concat(HAS_FOOD?[['food','food','餐廳',I.food]]:[],[['info','info','資訊',I.info]]);
  navEl.style.gridTemplateColumns=`repeat(${items.length},minmax(0,1fr))`;
  navEl.innerHTML=items.map(([k,id,l,ic])=>`<button type="button" class="nb" data-go="${id}"${k===key?' aria-current="page"':''}>${ic}${l}</button>`).join('');}

function render(keepOpen){let open=[];if(keepOpen)open=[...view.querySelectorAll('details[open][data-dk]')].map(d=>d.dataset.dk);
  if(current==='info')renderInfo();else if(current==='food')renderFood();else if(current==='plan')renderPlan();else renderDay(+current.slice(1));
  if(keepOpen)open.forEach(k=>{const d=view.querySelector(`details[data-dk="${CSS.escape(k)}"]`);if(d)d.open=true;});
  renderNav();}
function select(id,toTop=true){if(id!==current)showPast=false;current=id;try{localStorage.setItem(TRIP.storageKey,id);}catch(e){}render(false);if(toTop)window.scrollTo({top:0});}

function openDrv(k){const isH=k==='@hotel';const p=isH?{n:HOTEL.name,a:HOTEL.addr,q:HOTEL.q}:PLACES[k];if(!p)return;
  const di=current.startsWith('d')?+current.slice(1):todayIdx;const keys=[];
  if(di>=0)DAYS[di].items.forEach(it=>{const o=it[7]||{};if(o.p&&PLACES[o.p]&&!keys.includes(o.p))keys.push(o.p);});
  if(!isH&&!keys.includes(k))keys.unshift(k);
  const list=(hotelReady?['@hotel']:[]).concat(keys);
  drv.innerHTML=`<div class="dv-top"><button type="button" class="dv-back" id="dvback">${I.back}返回</button><span>把手機轉向司機</span></div>
    <div class="dv-main" lang="${DRV.lang}"><p class="dv-ask">${esc(DRV.ask)}</p><p class="dv-name">${esc(p.n)}</p>${p.a?`<p class="dv-addr">${esc(p.a)}</p>`:''}${p.ts?`<p class="dv-tel">${esc(DRV.tel)} ${esc(p.ts)}</p>`:''}</div>
    <div class="dv-foot">${list.length>1?`<div class="dv-chips" aria-label="今日地點">${list.map(x=>`<button type="button" class="dv-chip" aria-pressed="${x===k}" data-drv="${esc(x)}">${x==='@hotel'?'飯店':esc(PLACES[x].n)}</button>`).join('')}</div>`:''}
    <div class="acts"><a class="act pri" href="${M(p.q,p.c)}" target="_blank" rel="noopener">${I.pin}${MAPLABEL}</a><button type="button" class="act" data-copy="${esc(p.n+'\n'+(p.a||''))}">${I.copy}複製地址</button>${p.t?`<a class="act" href="tel:${esc(p.t)}">${I.phone}撥打</a>`:''}</div></div>`;
  const wasOpen=!drv.hidden;drv.hidden=false;document.body.classList.add('lock');drv.scrollTop=0;
  document.getElementById('dvback').onclick=closeDrv;if(!wasOpen)openDrv.from=document.activeElement;document.getElementById('dvback').focus();}
function closeDrv(){drv.hidden=true;document.body.classList.remove('lock');if(openDrv.from&&openDrv.from.focus)openDrv.from.focus();}

document.addEventListener('click',e=>{const t=e.target;if(!t.closest)return;
  const c=t.closest('[data-copy]');if(c){copy(c.dataset.copy,DRV.copied);return;}
  const d=t.closest('[data-drv]');if(d){openDrv(d.dataset.drv);return;}
  const g=t.closest('[data-go]');if(g){const sos=g.dataset.sos;select(g.dataset.go,!sos);if(sos){const el=document.getElementById('sos');if(el)el.scrollIntoView({block:'start'});}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!drv.hidden)closeDrv();});

(function init(){document.title=TRIP.docTitle||TRIP.title;
  const j=localNow();todayIdx=DAYS.findIndex(d=>d.d===ymd(j));
  const valid=id=>id==='plan'||(id==='food'&&HAS_FOOD)||id==='info'||/^d\d+$/.test(id)&&+id.slice(1)<DAYS.length;
  let start=todayIdx>=0?'d'+todayIdx:null;
  if(!start){try{start=localStorage.getItem(TRIP.storageKey);}catch(e){}}
  if(!start||!valid(start))start='plan';
  current=start;render(false);
  let sig='';const sigOf=()=>{if(todayIdx<0)return'';const S=state(todayIdx);return S.cur+','+S.next+','+S.past.length+','+S.nm;};sig=sigOf();
  setInterval(()=>{const nt=DAYS.findIndex(d=>d.d===ymd(localNow()));if(nt!==todayIdx){todayIdx=nt;render(true);sig=sigOf();return;}
    const s=sigOf();if(s!==sig){sig=s;if(current.startsWith('d')&&DAYS[+current.slice(1)]&&isTd(+current.slice(1)))render(true);}},60000);
})();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
